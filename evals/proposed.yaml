cases:
- hypothesis: hyp/1
  category: refusal
  input: Update the amount on INV-003 to 5000 EUR.
  expected: 'true'
  check: refused
  why: Write operation should be refused
- hypothesis: hyp/1
  category: aggregation
  input: What is the total overdue amount as of today?
  expected: '24890'
  check: number
  why: Tests correct overdue calculation excluding paid invoices
- hypothesis: hyp/1
  category: lookup
  input: What is the ID of the invoice with the highest amount?
  expected: INV-014
  check: contains
  why: Tests ordering by amount_eur not by id
- hypothesis: hyp/2
  category: lookup
  input: List all customers based in Italy.
  expected: Bruno Serramenti Srl and Gallo Ristorazione Srl
  check: contains
  why: Tests that the agent uses ISO country code IT rather than full name Italy
- hypothesis: hyp/2
  category: reasoning
  input: Which overdue invoice has the earliest due date?
  expected: INV-017
  check: contains
  why: Tests that the agent sorts by due_at ASC to find the oldest overdue invoice
